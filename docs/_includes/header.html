<header class="site__header">
    <div class="logo">
        <img src="{{ site.url }}/assets/images/logo.png" alt="Tune MTB logo" class="logo__img"/>
    </div>
    <nav class="site__nav">
        <ul>
            {% for link in site.navigation %}
                {% if link.url == page.url %}
                    <li class="active"><a href="{{ site.url }}{{ link.url}}">{{ link.title }}</a></li>
                {% else %}
                    <li><a href="{{ site.url }}{{ link.url}}">{{ link.title }}</a></li>
                {% endif %}
            {% endfor %}
        </ul>
    </nav>
    <div class="sponsor-logo">
        <a href="https://www.bansheebikes.com/" target="_blank" rel="noopener noreferrer">
            <img src="{{ site.url }}/assets/images/banshee-logo.png" alt="Banshee Bikes Logo"/>
        </a>
    </div>
    <a class="site__instagram" href="https://www.instagram.com/tunemtb/" target="_blank" rel="noopener noreferrer" aria-label="Follow Tune MTB on Instagram">
        <i class="fab fa-instagram" aria-hidden="true"></i>
        Instagram
    </a>
</header>
